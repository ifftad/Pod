<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PODOLA — Coming Soon</title>
<meta name="description" content="PODOLA. Crunchy peas. Big flavor. Coming soon.">
<meta name="theme-color" content="#0d2113">

<!-- Open Graph -->
<meta property="og:title" content="PODOLA — Coming Soon">
<meta property="og:description" content="Crunchy peas. Big flavor.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23a5d977'/><circle cx='36' cy='36' r='13' fill='%23d6efb8'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-core:#1c3f22;
    --bg-mid:#143019;
    --bg-edge:#0a1b0f;
    --pea-light:#d8f0b4;
    --pea-mid:#a9db7c;
    --pea-deep:#6fae4d;
    --ring:#4c7f43;
    --type-hero:#9ecb5f;
    --type-sub:#5f9040;
    --type-contact:#7cb44e;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{height:100%;}

  body{
    background:
      radial-gradient(120% 85% at 50% 44%, var(--bg-core) 0%, var(--bg-mid) 42%, var(--bg-edge) 100%),
      var(--bg-edge);
    color:var(--type-hero);
    font-family:'Poppins','Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100svh;
    padding:calc(2rem + env(safe-area-inset-top)) 1.5rem calc(2rem + env(safe-area-inset-bottom));
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* soft glow behind the pod */
  body::before{
    content:"";
    position:fixed;
    left:50%;
    top:42%;
    width:min(720px,120vw);
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(124,180,78,.16) 0%, rgba(124,180,78,0) 62%);
    pointer-events:none;
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:1;
    justify-content:center;
    gap:clamp(2rem,7vh,3.5rem);
  }

  .pod{
    width:min(340px,72vw);
    height:auto;
    overflow:visible;
    display:block;
  }

  .wordmark{
    font-weight:800;
    font-size:clamp(3.1rem,15vw,5.6rem);
    line-height:.9;
    letter-spacing:.01em;
    color:var(--type-hero);
    text-align:center;
  }

  .status{
    display:block;
    margin-top:clamp(.9rem,3vw,1.35rem);
    font-weight:600;
    font-size:clamp(.72rem,3.1vw,.95rem);
    letter-spacing:.42em;
    text-indent:.42em;
    color:var(--type-sub);
    text-align:center;
  }

  .contact{
    font-weight:500;
    font-size:clamp(.68rem,3vw,.9rem);
    letter-spacing:.16em;
    color:var(--type-contact);
    text-align:center;
    user-select:text;
    -webkit-user-select:text;
    padding-top:2rem;
  }

  /* ---------- motion ---------- */

  .pea{ transform-box:fill-box; transform-origin:50% 100%; }
  .pea-a{ animation:bob 3.4s ease-in-out infinite; }
  .pea-b{ animation:bob 3.4s ease-in-out .28s infinite; }
  .pea-c{ animation:bob 3.4s ease-in-out .56s infinite; }

  @keyframes bob{
    0%,100%{ transform:translateY(0) scale(1,1); }
    45%   { transform:translateY(-7px) scale(.995,1.008); }
    72%   { transform:translateY(1.5px) scale(1.008,.994); }
  }

  .ring{
    transform-box:fill-box;
    transform-origin:50% 50%;
    animation:sway 9s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ transform:rotate(-1.4deg) scale(1); opacity:.78; }
    50%    { transform:rotate(1.4deg) scale(1.025); opacity:1; }
  }

  .gleam{ animation:sweep 6.5s ease-in-out infinite; }
  @keyframes sweep{
    0%,55%  { transform:translateX(30px); }
    85%,100%{ transform:translateX(340px); }
  }

  .spark{ animation:twinkle 5s ease-in-out infinite; }
  .spark-2{ animation-delay:1.6s; }
  @keyframes twinkle{
    0%,100%{ opacity:.55; }
    50%    { opacity:.95; }
  }

  @media (prefers-reduced-motion:reduce){
    .pea-a,.pea-b,.pea-c,.ring,.gleam,.spark{ animation:none; }
    .ring{ opacity:.85; }
    .gleam{ display:none; }
  }
</style>
</head>
<body>

  <main class="stage">

    <svg class="pod" viewBox="0 0 400 250" role="img" aria-label="Three peas inside an open pod outline">
      <defs>
        <radialGradient id="peaFill" cx="33%" cy="28%" r="78%">
          <stop offset="0%"   stop-color="#e6f8cb"/>
          <stop offset="34%"  stop-color="var(--pea-light)"/>
          <stop offset="72%"  stop-color="var(--pea-mid)"/>
          <stop offset="100%" stop-color="var(--pea-deep)"/>
        </radialGradient>

        <!-- edge shading: keeps the sphere from reading as a flat ball -->
        <radialGradient id="peaShade" cx="38%" cy="34%" r="72%">
          <stop offset="60%"  stop-color="#3f7a2c" stop-opacity="0"/>
          <stop offset="88%"  stop-color="#3f7a2c" stop-opacity=".28"/>
          <stop offset="100%" stop-color="#2c5b1e" stop-opacity=".5"/>
        </radialGradient>

        <!-- bounced light along the lower edge -->
        <linearGradient id="peaBounce" x1="0" y1="1" x2=".3" y2="0">
          <stop offset="0%"   stop-color="#cdeb9b" stop-opacity=".55"/>
          <stop offset="45%"  stop-color="#cdeb9b" stop-opacity="0"/>
        </linearGradient>

        <!-- one pea, drawn at radius 50 around the origin -->
        <g id="peaShape">
          <path d="M0-49.5 C27-49.5 49-27.5 49.5-1 C50 26 27.5 48.5 0.5 49.5 C-27 50.5 -49.5 27 -49.5 -0.5 C-49.5 -28 -27.5 -49.5 0-49.5Z"
                fill="url(#peaFill)"/>
          <path d="M0-49.5 C27-49.5 49-27.5 49.5-1 C50 26 27.5 48.5 0.5 49.5 C-27 50.5 -49.5 27 -49.5 -0.5 C-49.5 -28 -27.5 -49.5 0-49.5Z"
                fill="url(#peaShade)"/>
          <path d="M0-49.5 C27-49.5 49-27.5 49.5-1 C50 26 27.5 48.5 0.5 49.5 C-27 50.5 -49.5 27 -49.5 -0.5 C-49.5 -28 -27.5 -49.5 0-49.5Z"
                fill="url(#peaBounce)"/>
          <!-- hilum: the little scar where the pea met the pod -->
          <ellipse cx="6" cy="41" rx="8" ry="3.6" fill="#5f9a3d" opacity=".45" transform="rotate(-12 6 41)"/>
          <ellipse cx="6" cy="40" rx="8" ry="3.2" fill="#d3ecab" opacity=".18" transform="rotate(-12 6 40)"/>
        </g>

        <linearGradient id="gleamFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="50%"  stop-color="#ffffff" stop-opacity=".42"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>

        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#06180b" flood-opacity=".55"/>
        </filter>

        <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>

        <clipPath id="peaClip">
          <circle cx="150" cy="152" r="44"/>
          <circle cx="203" cy="128" r="54"/>
          <circle cx="252" cy="155" r="42"/>
        </clipPath>
      </defs>

      <!-- pod outline -->
      <path class="ring"
            d="M112 196 C86 122 148 66 208 66 C274 66 307 112 297 159 C289 198 248 212 212 205"
            fill="none" stroke="var(--ring)" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>

      <!-- peas -->
      <g filter="url(#soft)">
        <g class="pea pea-a">
          <use href="#peaShape" transform="translate(150 152) rotate(-14) scale(.84 .81)"/>
          <ellipse class="spark" cx="134" cy="134" rx="12" ry="7.5" fill="#ffffff" opacity=".5" filter="url(#blur6)" transform="rotate(-30 134 134)"/>
        </g>
        <g class="pea pea-c">
          <use href="#peaShape" transform="translate(252 155) rotate(22) scale(.8 .78)"/>
          <ellipse class="spark spark-2" cx="237" cy="140" rx="11" ry="7" fill="#ffffff" opacity=".45" filter="url(#blur6)" transform="rotate(-30 237 140)"/>
        </g>
        <g class="pea pea-b">
          <use href="#peaShape" transform="translate(203 128) rotate(6) scale(1.04 1)"/>
          <ellipse class="spark" cx="184" cy="106" rx="15" ry="9.5" fill="#ffffff" opacity=".55" filter="url(#blur6)" transform="rotate(-30 184 106)"/>
        </g>
      </g>

      <!-- gleam sweeping across the peas -->
      <g clip-path="url(#peaClip)">
        <g transform="rotate(16 200 140)">
          <rect class="gleam" x="0" y="-40" width="52" height="340" fill="url(#gleamFill)"/>
        </g>
      </g>
    </svg>

    <div>
      <h1 class="wordmark">PODOLA</h1>
      <span class="status">COMING SOON</span>
    </div>

  </main>

  <p class="contact">CONTACT — ANDREW@PODOLAPEAS.COM</p>

</body>
</html>
