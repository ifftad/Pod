<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PODOLA — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #16301F;
    --bg-2: #0D2013;
    --pea: #A6D07C;
    --pea-hi: #D3EDB0;
    --pea-shadow: #6E9750;
    --ink: #0B0F0C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(120% 140% at 50% 30%, var(--bg-1) 0%, var(--bg-2) 78%);
    font-family: 'Nunito Sans', sans-serif;
  }

  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(166,208,124,0.16) 0%, rgba(166,208,124,0) 68%);
    filter: blur(2px);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6rem;
    padding: 2rem;
  }

  svg#mark {
    width: min(46vw, 190px);
    height: auto;
    overflow: visible;
  }

  .pea {
    transform-origin: center;
    opacity: 0;
    animation: settle 1s cubic-bezier(.3,1.4,.5,1) both;
  }
  .pea.p1 { animation-delay: .08s; }
  .pea.p2 { animation-delay: .22s; }
  .pea.p3 { animation-delay: .36s; }

  @keyframes settle {
    0%   { opacity: 0; transform: scale(0.35) translateY(-10px); }
    65%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .shell {
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw 1s ease-out 0s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .wordmark {
    text-align: center;
    opacity: 0;
    animation: rise .7s ease-out .85s forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255,255,255,0.05);
  }

  p.tag {
    margin: 0.5rem 0 0;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--pea);
    opacity: 0.85;
  }

  @media (prefers-reduced-motion: reduce) {
    .pea, .shell, .wordmark, .glow {
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
    }
  }

  .contact {
    position: fixed;
    bottom: 1.8rem;
    left: 0;
    right: 0;
    text-align: center;
    opacity: 0;
    animation: rise .7s ease-out 1.15s forwards;
  }

  .contact a {
    color: var(--pea);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    opacity: 0.7;
    border-bottom: 1px solid transparent;
    padding-bottom: 2px;
    transition: opacity .2s ease, border-color .2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    opacity: 1;
    border-color: var(--pea);
  }

  @media (prefers-reduced-motion: reduce) {
    .contact { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="content">
      <svg id="mark" viewBox="0 0 240 150" aria-hidden="true">
        <defs>
          <linearGradient id="peaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--pea-hi)"/>
            <stop offset="55%" stop-color="var(--pea)"/>
            <stop offset="100%" stop-color="var(--pea-shadow)"/>
          </linearGradient>
          <radialGradient id="peaHighlight" cx="32%" cy="28%" r="55%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06120A" flood-opacity="0.35"/>
          </filter>
        </defs>

        <path class="shell" d="M 15 95 Q 10 25 120 15 Q 230 25 225 95 Q 220 138 120 138 Q 20 138 15 95 Z"
              fill="none" stroke="var(--pea-shadow)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

        <g filter="url(#soft)">
          <circle class="pea p1" cx="68"  cy="82" r="30" fill="url(#peaGrad)"/>
          <circle class="pea p2" cx="120" cy="62" r="33" fill="url(#peaGrad)"/>
          <circle class="pea p3" cx="174" cy="86" r="29" fill="url(#peaGrad)"/>
        </g>
        <circle class="pea p1" cx="68"  cy="82" r="30" fill="url(#peaHighlight)"/>
        <circle class="pea p2" cx="120" cy="62" r="33" fill="url(#peaHighlight)"/>
        <circle class="pea p3" cx="174" cy="86" r="29" fill="url(#peaHighlight)"/>
      </svg>

      <div class="wordmark">
        <h1>PODOLA</h1>
        <p class="tag">Coming soon</p>
      </div>
    </div>
    <div class="contact">
      <a href="mailto:andrew@podolapeas.com">Contact — andrew@podolapeas.com</a>
    </div>
  </div>
</body>
</html>
