<style>
  :root{
    --forest:#212f17;
    --pea:#a0bf4e;
    --blush:#f5e9e5;
    --white:#ffffff;
    /* Geologica Auto = Geologica with its Cursive axis at 0.5 ("Auto"), loaded above */
    --font:'Geologica Auto','Geologica',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--blush);
    color:var(--forest);
    font-family:var(--font);
    font-weight:200;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit}
  svg{display:block;width:100%;height:auto}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px clamp(16px,4vw,48px);
    max-width:1200px;width:100%;margin:0 auto;
  }
  .brand{display:block;width:clamp(110px,16vw,150px)}
  .tabs{display:flex;gap:6px;background:var(--white);padding:5px;border-radius:999px}
  .tab{
    font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
    text-decoration:none;color:var(--forest);
    padding:9px 18px;border-radius:999px;transition:background .2s,color .2s;
  }
  .tab:hover{background:var(--blush)}
  .tab[aria-current="page"]{background:var(--forest);color:var(--pea)}
  .tab:focus-visible{outline:3px solid var(--forest);outline-offset:2px}

  main{flex:1;display:flex}
  .panel{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 16px 64px;
  }
  .js .panel[hidden]{display:none}

<script>
  (function(){
    var tabs=document.querySelectorAll('[data-tab]'), panels=document.querySelectorAll('[data-panel]');
    function show(){
      var id=location.hash==='#contact'?'contact':'home';
      panels.forEach(function(p){p.hidden=p.dataset.panel!==id});
      tabs.forEach(function(t){ if(t.dataset.tab===id) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current'); });
      document.title=id==='contact'?'PODOLA — Contact':'PODOLA';
      window.scrollTo(0,0);
    }
    window.addEventListener('hashchange',show); show();
    document.getElementById('yr').textContent=new Date().getFullYear();
  })();

</script>
