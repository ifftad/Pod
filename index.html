<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podola — crispy coated peas</title>
<meta name="description" content="Podola. Crispy coated peas, coming in hot. Get in touch: andrew@podolapeas.com">
<meta name="theme-color" content="#0B2A16">
<meta property="og:title" content="Podola">
<meta property="og:description" content="Crispy coated peas, coming in hot.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://podolapeas.com">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B2A16'/%3E%3Ccircle cx='36' cy='58' r='22' fill='%238FC742' stroke='%23F5FAE6' stroke-width='7'/%3E%3Ccircle cx='64' cy='58' r='22' fill='%238FC742' stroke='%23F5FAE6' stroke-width='7'/%3E%3Ccircle cx='50' cy='40' r='24' fill='%23A9DB55' stroke='%23F5FAE6' stroke-width='7'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">

<style>
:root{
  --lime:#C9E85C;
  --deep:#0B2A16;
  --burst:#1C5E31;
  --cream:#F5FAE6;
  --ink:#0B2A16;
  --pea-lite:#E9F7B4;
  --pea:#8FC742;
  --pea-dark:#5E9128;
  --heat:#FF6B35;
}

*{margin:0;padding:0;box-sizing:border-box}

html,body{height:100%}

body{
  background:var(--deep);
  color:var(--cream);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* ---------- stage ---------- */

.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,3.5vw,30px);
  padding:clamp(24px,6vw,60px) 28px;
  position:relative;
  isolation:isolate;
}

/* soft burst behind the peas — snack-bag vernacular, kept very quiet */
.burst{
  position:absolute;
  top:34%;
  left:50%;
  width:min(150vw,1100px);
  aspect-ratio:1;
  translate:-50% -50%;
  z-index:-1;
  opacity:1;
  animation:spin 90s linear infinite;
}
.burst path{fill:var(--burst)}

@keyframes spin{to{rotate:360deg}}

/* ---------- logo ---------- */

.logo{
  width:min(70vw,340px);
  height:auto;
  overflow:visible;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.pod{
  fill:none;
  stroke:var(--cream);
  stroke-width:11;
  stroke-linecap:round;
  stroke-dasharray:640;
  stroke-dashoffset:640;
  animation:draw .7s cubic-bezier(.6,0,.3,1) .1s forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}

.pea{
  transform-box:fill-box;
  transform-origin:center bottom;
  opacity:0;
  animation:drop .62s cubic-bezier(.3,1.5,.5,1) forwards;
}
.pea--l{animation-delay:.42s}
.pea--c{animation-delay:.56s}
.pea--r{animation-delay:.70s}

@keyframes drop{
  0%{opacity:0;translate:0 -90px;scale:.85 1.15}
  60%{opacity:1;translate:0 0;scale:1.12 .88}
  100%{opacity:1;translate:0 0;scale:1 1}
}

/* tap / click reaction */
.logo.pop .pea{animation:hop .45s cubic-bezier(.34,1.7,.5,1)}
.logo.pop .pea--c{animation-delay:.05s}
.logo.pop .pea--r{animation-delay:.1s}
@keyframes hop{
  0%{translate:0 0;scale:1 1}
  30%{translate:0 -34px;scale:.9 1.14}
  70%{translate:0 0;scale:1.14 .88}
  100%{translate:0 0;scale:1 1}
}

/* ---------- type ---------- */

.wordmark{
  font-size:clamp(3rem,17vw,10rem);
  font-variation-settings:'wdth' 125,'wght' 900;
  letter-spacing:-.005em;
  line-height:.8;
  text-transform:uppercase;
  paint-order:stroke fill;
  color:#8FC742;
  -webkit-text-stroke:5px var(--cream);
  text-shadow:0 3px 0 rgba(0,0,0,.28);
  opacity:0;
  animation:rise .55s cubic-bezier(.2,.9,.3,1) .85s forwards;
}

.line{
  font-size:clamp(1.05rem,4.4vw,1.5rem);
  font-variation-settings:'wdth' 100,'wght' 650;
  letter-spacing:-.005em;
  color:var(--cream);
  text-align:center;
  paint-order:stroke fill;
  -webkit-text-stroke:2px var(--deep);
  text-shadow:0 2px 0 rgba(0,0,0,.3);
  opacity:0;
  animation:rise .5s ease-out 1.05s forwards;
}
.line b{font-variation-settings:'wdth' 100,'wght' 850;color:var(--heat)}

@keyframes rise{
  from{opacity:0;translate:0 22px}
  to{opacity:1;translate:0 0}
}

/* ---------- contact band ---------- */

.band{
  display:block;
  background:var(--lime);
  color:var(--ink);
  text-decoration:none;
  padding:clamp(14px,3.4vw,20px) 0;
  overflow:hidden;
  white-space:nowrap;
  translate:0 100%;
  animation:up .5s cubic-bezier(.2,.9,.3,1) 1.15s forwards;
  padding-bottom:max(clamp(14px,3.4vw,20px),env(safe-area-inset-bottom));
}
@keyframes up{to{translate:0 0}}

.track{
  display:inline-flex;
  align-items:center;
  animation:slide 22s linear infinite;
}
.band:hover .track,.band:focus-visible .track{animation-play-state:paused}
@keyframes slide{to{translate:-50% 0}}

.track span{
  display:inline-flex;
  align-items:center;
  gap:clamp(16px,4vw,28px);
  padding-right:clamp(16px,4vw,28px);
  font-size:clamp(.92rem,3.4vw,1.15rem);
  font-variation-settings:'wdth' 78,'wght' 700;
  letter-spacing:.04em;
}
.track i{
  width:.5em;height:.5em;
  border-radius:50%;
  background:var(--heat);
  flex:none;
}

.band:focus-visible{outline:4px solid var(--heat);outline-offset:-6px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;translate:none!important;opacity:1!important;scale:none!important}
  .pod{stroke-dashoffset:0}
}
</style>
</head>

<body>

<main class="stage">
  <svg class="burst" viewBox="0 0 200 200" aria-hidden="true">
    <path d="M100 0 L112 74 L142 12 L130 82 L177 27 L146 92 L196 60 L152 104 L200 100 L152 116 L196 148 L142 124 L177 173 L124 136 L136 194 L106 140 L100 200 L88 140 L58 194 L70 124 L23 173 L54 112 L4 148 L48 100 L0 96 L48 84 L4 52 L58 76 L23 27 L76 64 L64 6 Z"/>
  </svg>

  <svg class="logo" id="logo" viewBox="0 0 400 250" role="img" aria-label="Podola">
    <path class="pod" d="M58 196 C40 74 138 22 214 38 C304 57 366 124 340 208"/>
    <g class="pea pea--l">
      <circle cx="118" cy="168" r="50" fill="var(--pea)" stroke="var(--cream)" stroke-width="11"/>
      <ellipse cx="100" cy="148" rx="15" ry="11" fill="var(--pea-lite)" opacity=".85" transform="rotate(-32 100 148)"/>
    </g>
    <g class="pea pea--r">
      <circle cx="286" cy="176" r="44" fill="var(--pea)" stroke="var(--cream)" stroke-width="11"/>
      <ellipse cx="271" cy="158" rx="13" ry="9" fill="var(--pea-lite)" opacity=".85" transform="rotate(-32 271 158)"/>
    </g>
    <g class="pea pea--c">
      <circle cx="202" cy="144" r="60" fill="var(--pea)" stroke="var(--cream)" stroke-width="11"/>
      <ellipse cx="180" cy="120" rx="18" ry="13" fill="var(--pea-lite)" opacity=".85" transform="rotate(-32 180 120)"/>
    </g>
  </svg>

  <h1 class="wordmark">Podola</h1>
  <p class="line">Crispy coated peas, coming in <b>hot</b>.</p>
</main>

<a class="band" href="mailto:andrew@podolapeas.com" aria-label="Email andrew@podolapeas.com">
  <div class="track">
    <span>
      andrew@podolapeas.com <i></i> andrew@podolapeas.com <i></i>
      andrew@podolapeas.com <i></i> andrew@podolapeas.com <i></i>
    </span>
    <span aria-hidden="true">
      andrew@podolapeas.com <i></i> andrew@podolapeas.com <i></i>
      andrew@podolapeas.com <i></i> andrew@podolapeas.com <i></i>
    </span>
  </div>
</a>

<script>
  var logo = document.getElementById('logo');
  logo.addEventListener('pointerdown', function () {
    logo.classList.remove('pop');
    void logo.offsetWidth;
    logo.classList.add('pop');
  });
  logo.addEventListener('animationend', function (e) {
    if (e.animationName === 'hop') logo.classList.remove('pop');
  });
</script>

</body>
</html>
