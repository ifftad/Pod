<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podola Peas — Coming Soon</title>

<!-- Favicon: inline pea SVG, no extra file needed -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2316301F'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23A6D07C'/%3E%3Ccircle cx='38' cy='38' r='12' fill='%23D3EDB0' opacity='0.6'/%3E%3C/svg%3E">

<!-- Search + social metadata -->
<meta name="description" content="Podola Peas is a snack food company launching soon. Sign up to be the first to know.">
<meta property="og:site_name" content="Podola Peas">
<meta property="og:title" content="Podola Peas — Coming Soon">
<meta property="og:description" content="Podola Peas is a snack food company launching soon. Sign up to be the first to know.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #16301F;
    --bg-2: #0D2013;
    --pea: #A6D07C;
    --pea-hi: #D3EDB0;
    --pea-shadow: #6E9750;
    --ink: #0B0F0C;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(120% 140% at 50% 30%, var(--bg-1) 0%, var(--bg-2) 78%);
    font-family: 'Nunito Sans', sans-serif;
  }

  .stage {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .glow {
    position: absolute;
    width: min(60vw, 620px);
    height: min(60vw, 620px);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(166,208,124,0.16) 0%, rgba(166,208,124,0) 68%);
    filter: blur(2px);
    animation: breathe 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  .content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    padding: 2rem;
  }

  svg#mark {
    width: clamp(180px, 22vw, 320px);
    height: auto;
    overflow: visible;
  }

  .pea-enter {
    transform-origin: center;
    transform-box: fill-box;
    opacity: 0;
    animation: settle 1s cubic-bezier(.3,1.4,.5,1) both;
  }
  .pea-enter.p1 { animation-delay: .08s; }
  .pea-enter.p2 { animation-delay: .22s; }
  .pea-enter.p3 { animation-delay: .36s; }

  @keyframes settle {
    0%   { opacity: 0; transform: scale(0.35) translateY(-10px); }
    65%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .pea-pulse {
    transform-origin: center;
    transform-box: fill-box;
    animation: pulse 4.5s ease-in-out infinite;
  }
  .pea-pulse.p1 { animation-duration: 2.6s; animation-delay: .6s; }
  .pea-pulse.p2 { animation-duration: 3s;   animation-delay: 1s; }
  .pea-pulse.p3 { animation-duration: 2.3s; animation-delay: .8s; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.14); }
  }

  .shell {
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    animation: draw 1s ease-out 0s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .wordmark {
    text-align: center;
    opacity: 0;
    animation: rise .7s ease-out .85s forwards;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    margin: 0;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(3.2rem, 8vw, 6.5rem);
    letter-spacing: 0.01em;
    background: linear-gradient(135deg, var(--pea-hi) 0%, var(--pea) 55%, var(--pea-shadow) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p.tag {
    margin: 0.6rem 0 0;
    font-size: clamp(0.9rem, 1.4vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--pea);
    opacity: 0.85;
  }

  .contact {
    position: fixed;
    bottom: 2.4rem;
    left: 0;
    right: 0;
    text-align: center;
    opacity: 0;
    animation: rise .7s ease-out 1.15s forwards;
  }

  .contact a {
    color: var(--pea);
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    opacity: 0.75;
    border-bottom: 1px solid transparent;
    padding-bottom: 3px;
    transition: opacity .2s ease, border-color .2s ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    opacity: 1;
    border-color: var(--pea);
  }

  @media (prefers-reduced-motion: reduce) {
    .pea-enter, .pea-pulse, .shell, .wordmark, .glow, .contact {
      animation: none !important;
      opacity: 1 !important;
      stroke-dashoffset: 0 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="content">
      <svg id="mark" viewBox="0 0 240 150" aria-hidden="true">
        <defs>
          <linearGradient id="peaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--pea-hi)"/>
            <stop offset="55%" stop-color="var(--pea)"/>
            <stop offset="100%" stop-color="var(--pea-shadow)"/>
          </linearGradient>
          <radialGradient id="peaHighlight" cx="32%" cy="28%" r="55%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#06120A" flood-opacity="0.35"/>
          </filter>
        </defs>

        <path class="shell" d="M 15 95 Q 10 25 120 15 Q 230 25 225 95 Q 220 138 120 138 Q 20 138 15 95 Z"
              fill="none" stroke="var(--pea-shadow)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

        <g class="pea-enter p1">
          <g class="pea-pulse p1">
            <circle cx="68" cy="82" r="30" fill="url(#peaGrad)" filter="url(#soft)"/>
            <circle cx="68" cy="82" r="30" fill="url(#peaHighlight)"/>
          </g>
        </g>
        <g class="pea-enter p2">
          <g class="pea-pulse p2">
            <circle cx="120" cy="62" r="33" fill="url(#peaGrad)" filter="url(#soft)"/>
            <circle cx="120" cy="62" r="33" fill="url(#peaHighlight)"/>
          </g>
        </g>
        <g class="pea-enter p3">
          <g class="pea-pulse p3">
            <circle cx="174" cy="86" r="29" fill="url(#peaGrad)" filter="url(#soft)"/>
            <circle cx="174" cy="86" r="29" fill="url(#peaHighlight)"/>
          </g>
        </g>

      </svg>

      <div class="wordmark">
        <h1>PODOLA</h1>
        <p class="tag">Coming soon</p>
      </div>
    </div>
    <div class="contact">
      <a href="mailto:andrew@podolapeas.com">Contact — andrew@podolapeas.com</a>
    </div>
  </div>
</body>
</html>
